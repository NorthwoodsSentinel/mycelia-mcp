# Bug report form. Adapted from the MCP Inspector's
# (modelcontextprotocol/inspector, .github/ISSUE_TEMPLATE/1-bug_report.yml);
# record: PROVENANCE.md. `labels:` is static, and `bug` exists in this
# repository's label set.
name: Bug report
description: Report something broken in mycelia-mcp
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug — **issues are how work reaches mycelia-mcp.**

        This repository accepts **issues, not pull requests**: design and
        implementation are done by the maintainer through a prompt-driven
        workflow ([`CONTRIBUTING.md`](https://github.com/NorthwoodsSentinel/mycelia-mcp/blob/main/CONTRIBUTING.md)).
        So if you have already prototyped a fix locally, **the prompt you used
        is worth more than a diff** — there is a field for it at the bottom of
        this form.

        > 🔒 **Do not report security vulnerabilities here.** Use the
        > [private advisory process](https://github.com/NorthwoodsSentinel/mycelia-mcp/security/advisories/new)
        > instead — see [`SECURITY.md`](https://github.com/NorthwoodsSentinel/mycelia-mcp/blob/main/SECURITY.md).

        > 🔑 **This issue is public.** Remove your Mycelia agent key, any other
        > secret, and anything private (a home-directory path, a host name, an
        > agent's name) from everything you paste below — including a prompt.

  - type: dropdown
    id: tool
    attributes:
      label: Which tool?
      description: The server exposes eight tools over stdio.
      options:
        - mycelia_browse_requests
        - mycelia_get_request
        - mycelia_claim_request
        - mycelia_respond
        - mycelia_rate_response
        - mycelia_feed
        - mycelia_my_outgoing
        - mycelia_post_request
        - All tools / startup / not tool-specific
    validations:
      required: true

  - type: input
    id: server-version
    attributes:
      label: mycelia-mcp version
      description: >
        The commit you ran (`git rev-parse --short HEAD`), or the `version` in
        its `package.json`. Not "latest".
      placeholder: "16e7b6a"
    validations:
      required: true

  - type: input
    id: bun-version
    attributes:
      label: Bun version
      description: Output of `bun --version`. The server runs on Bun.
      placeholder: "1.3.14"
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "macOS 15.5"
    validations:
      required: false

  - type: textarea
    id: mcp-host
    attributes:
      label: MCP host
      description: >
        What ran the server — the MCP host or client and its version, and how
        the server is configured in it (the command, and the names of the
        environment variables you set). Never paste the value of a key or a
        token. Write a home-directory path as `~/...`, and write `<NAME>` in
        place of your agent's name, as the example does.
      placeholder: |
        Host: Claude Code 2.1.250
        Command: bun ~/mycelia-mcp/src/index.ts
        Environment: MYCELIA_MCP_AGENT_NAME, MYCELIA_PERSONAL_AGENT_ID_<NAME>,
          MYCELIA_PERSONAL_KEY_<NAME>, MYCELIA_PERSONAL_API_BASE, MYCELIA_ENV_FILE
          (names only, no values; say whether a key file exists, never what is in it)
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Numbered steps, starting from a fresh start of the server.
      placeholder: |
        1. Start the server under the host above
        2. Call `mycelia_feed` with `{"limit": 5}`
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What you expected to happen.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs or errors
      description: >
        The tool's returned error, the host's log for this server, or the
        server's stderr. Remove keys, tokens, secrets, home-directory paths,
        host names and agent names first.
    validations:
      required: false

  - type: textarea
    id: prompt
    attributes:
      label: Already prototyped a fix?
      description: >
        Please don't attach a diff or open a pull request — share the **exact
        prompt(s)** you used to produce the change, with any key, secret or
        private detail in them replaced by a placeholder, plus what you verified. If
        it is taken up, it is reproduced through the workflow here with the right
        conventions, tests, and coverage.
    validations:
      required: false

  - type: checkboxes
    id: acknowledgements
    attributes:
      label: Before you submit
      options:
        - label: I searched existing issues and this is not a duplicate.
          required: true
        - label: This is not a security vulnerability report (those go through the private advisory process).
          required: true
        - label: I removed my Mycelia agent key, any other secret, and any private detail (home-directory path, host name, agent name) from this report, including from any prompt.
          required: true
