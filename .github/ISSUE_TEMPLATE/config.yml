# Issue chooser configuration.
#
# Blank issues are disabled so every report arrives in a form. The bug form
# requires the facts triage needs first (tool, version, MCP host); the feature
# form requires a problem statement.
#
# Security reports are deliberately a *contact link* rather than a template:
# a template would still open a public issue, which is exactly what a
# vulnerability report must not do. These links leave GitHub's issue flow and
# go straight to the private advisory form. See SECURITY.md.
#
# Adapted from the MCP Inspector's chooser (modelcontextprotocol/inspector);
# record: PROVENANCE.md.
blank_issues_enabled: false
contact_links:
  - name: 🔒 Security vulnerability — report privately
    url: https://github.com/NorthwoodsSentinel/mycelia-mcp/security/advisories/new
    about: >
      Never report a vulnerability in a public issue. Private vulnerability
      reporting is enabled on this repository — this link opens the advisory
      form, which is the fastest route to the maintainer.

  - name: 📜 Security policy (supported versions, what to include)
    url: https://github.com/NorthwoodsSentinel/mycelia-mcp/blob/main/SECURITY.md
    about: >
      Which versions are supported, how reports are handled, and what to
      include in one.

  - name: 🤝 Contribution policy — issues, not pull requests
    url: https://github.com/NorthwoodsSentinel/mycelia-mcp/blob/main/CONTRIBUTING.md
    about: >
      This repository accepts issues, not pull requests — the maintainer does
      the implementation. If you already built a change locally, open an issue
      and share the prompt you used rather than a diff.

  - name: 📖 MCP documentation
    url: https://modelcontextprotocol.io
    about: >
      Guides and reference for the Model Context Protocol itself. Start here
      for "how does MCP work" questions.

  - name: 📐 MCP specification — protocol questions and proposals
    url: https://github.com/modelcontextprotocol/modelcontextprotocol/issues
    about: >
      If the behavior you're reporting is defined by the protocol rather than
      by this server, file it against the specification repository instead.

  - name: 🧰 MCP TypeScript SDK
    url: https://github.com/modelcontextprotocol/typescript-sdk/issues
    about: >
      This server is built on the TypeScript SDK. If the bug reproduces against
      the SDK directly (outside this server), file it there.
