# Feature request form. Adapted from the MCP Inspector's
# (modelcontextprotocol/inspector, .github/ISSUE_TEMPLATE/2-feature_request.yml);
# record: PROVENANCE.md. `labels:` is static, and `enhancement` exists in this
# repository's label set.
name: Feature request
description: Suggest an improvement to mycelia-mcp
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement.

        **The maintainer does the implementation here** — this repository
        accepts **issues, not pull requests**
        ([`CONTRIBUTING.md`](https://github.com/NorthwoodsSentinel/mycelia-mcp/blob/main/CONTRIBUTING.md)).
        That makes a sharply-stated **problem** the most valuable thing you can
        give: it is what gets designed against, and it survives after a
        specific solution turns out not to fit.

        So please describe the problem first, and treat the solution section as
        one possible answer rather than the request itself.

  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: >
        What are you trying to do, and what makes it hard or impossible today?
        Describe the situation, not the feature — including how often you hit
        it and what you do instead right now.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Solution you have in mind (optional)
      description: >
        If you have a concrete idea, describe it here. It's fine to leave this
        blank — the problem above is the part that is needed.
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or workarounds you have tried
    validations:
      required: false

  - type: textarea
    id: prompt
    attributes:
      label: Already built it locally?
      description: >
        Please don't attach a diff or open a pull request — share the **exact
        prompt(s)** you used. If it is taken up, the work is reproduced through
        the workflow here with the right conventions, tests, and coverage.
    validations:
      required: false

  - type: checkboxes
    id: acknowledgements
    attributes:
      label: Before you submit
      options:
        - label: I searched existing issues and this is not a duplicate.
          required: true
        - label: This is a request for mycelia-mcp itself, not for the MCP specification, an SDK, or the Mycelia service.
          required: true
