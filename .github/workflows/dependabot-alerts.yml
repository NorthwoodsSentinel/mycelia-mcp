# The daily alert sweep: once a day it reads this repository's open Dependabot
# alerts and files one issue per bump, or edits the one it filed before. No
# pull request is opened. Dependabot opens none here either (AGENTS.md,
# "Dependency updates are issue-driven"), and this is what reports a known
# advisory in its place.
#
# In this repo: copied from modelcontextprotocol/inspector at commit
# 7df76f6eea9ea425891289333837878ebb31ae6a,
# .github/workflows/dependabot-alerts.yml, by copy then edit (the unchanged
# file is this file's first commit here). Record: PROVENANCE.md, "Sweeps".
# Design: docs/DESIGN-nor-673-sweeps.md, sections 2 and 3. The script's own
# edits are in the header of scripts/dependabot-alerts.mjs.
#
# Unchanged from the source: the name, the two triggers and the cron slot, the
# `concurrency` block and its reason, the job's name, `runs-on`, Node 22, the
# two pinned actions it already carried, and the two environment values the
# script is handed.
#
# Edits, each with its reason:
#
#   1. The checkout is this repository's one branch; the source's `ref:` names
#      its second branch, which does not exist here. With it goes the source's
#      warning that alerts are computed from one branch and shipped from
#      another. What stands in its place is in "What it cannot see", below.
#   2. The `PROJECT_TOKEN` line is removed. The source used that second token
#      for its project board and to read one setting. This repository has no
#      board, and no secret but `GITHUB_TOKEN` is named in this file.
#   3. The install is `bun install --frozen-lockfile --ignore-scripts`, as in
#      `main.yml`: this repository's lockfile is `bun.lock`, and there is no
#      `package-lock.json`. The source's `npm ci` and its `cache: npm` go, and
#      a pinned `oven-sh/setup-bun` step is added. The script needs the
#      install for one package, `semver`.
#   4. `persist-credentials: false` on the checkout, as in `main.yml`: nothing
#      here pushes.
#   5. `timeout-minutes`, which every job here declares (AGENTS.md). The source
#      has none on this job.
#   6. The permissions are on the JOB; the workflow's own are `contents: read`.
#      The source grants all three to the whole workflow. With one job the
#      grant reaches the same steps; stated on the job, it does not reach a
#      job added later.
#   7. This header, and the step names that named the source's branch.
#
# What the job holds: `GITHUB_TOKEN` with `contents: read`, `issues: write` and
# `vulnerability-alerts: read` in this repository, for the length of the job.
# No other secret is named. No model runs. It never runs a pull request's code:
# its triggers are the schedule and a manual run, and a manual run needs write
# access.
#
# It is a SCHEDULE, not an event handler, because there is no
# `dependabot_alert` workflow trigger: that is a webhook event only (the
# source's finding). Daily is deliberate: alerts are not minute-sensitive.
#
# The setting it reads back: Dependabot security updates is a repository
# SETTING and can be switched back on from the UI without a commit, so the
# script reads it and fails loudly on an explicit `enabled: true`. That read
# needs a permission `permissions:` has no key for, so with this job's token it
# reports UNVERIFIED and carries on (AGENTS.md: a conditional guard, not an
# invariant).
#
# What it cannot see (docs/DESIGN-nor-673-sweeps.md, section 5): GitHub's
# dependency graph for this repository holds its direct dependencies only, so
# an advisory on a transitive package raises no alert, and no sweep of the
# alerts can report it.
#
# What it needs that is not in this file, and is the owner's to create: the
# labels `chore` and `dependabot`. The script files each issue with `factory`,
# `chore` and `dependabot`; while one of them is missing, `gh issue create`
# fails, the script throws and the run is red. With no open alert the script
# files nothing and the run is green whether or not the labels exist.
#
# Each issue is filed by `github-actions[bot]`. That, with the labels, is how
# the next run knows an issue is its own (scripts/lib/sweep-author.mjs).
name: Dependabot Alert Sweep

on:
  schedule:
    - cron: "17 6 * * *" # 06:17 UTC daily; alerts are not minute-sensitive
  workflow_dispatch:

# The marker check is a read-before-write, not an atomic one, and nothing stops
# a `workflow_dispatch` from landing on top of the scheduled run. Two overlapping
# runs would both see no open issue and both file one, which is the exact
# duplicate this sweep's whole idempotency design exists to prevent (Copilot).
# `cancel-in-progress: false` because the queued run must WAIT and then re-read
# the state the first run wrote — cancelling it would drop a sweep instead.
concurrency:
  group: dependabot-alert-sweep
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  alert-sweep:
    runs-on: ubuntu-latest
    # PROVISIONAL: no run of this workflow had been observed when this was
    # written, and the source declares no timeout on this job to take a value
    # from. One run is an install, three listings (the setting, the alerts,
    # the open issues), and for each bump a comment listing and up to two
    # issue writes a second apart. 5 minutes is a hung-job guard, not a flake
    # remedy; re-size it from this repository's scheduled runs, with the
    # range, as AGENTS.md requires (Test-gate timeouts).
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      vulnerability-alerts: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.x"

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # Keep this version equal to CI_BUN_VERSION in main.yml, which states
          # why one Bun is pinned (the source's pattern for its npm pin).
          bun-version: "1.3.14"

      - name: Install dependencies
        # From bun.lock exactly, and without running any dependency's install
        # script. The sweep's one dependency is `semver`; it reads `bun.lock`
        # as text and needs nothing else of the installed tree.
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Run the Dependabot alert sweep
        run: node scripts/dependabot-alerts.mjs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
